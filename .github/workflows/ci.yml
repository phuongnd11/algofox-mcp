name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - run: pnpm install
      - run: pnpm test
      - run: node scripts/check-offline.mjs
      - name: bundle size gate (10 MB)
        run: |
          SIZE=$(du -sk content src | awk '{s+=$1} END {print s}')
          echo "bundle-ish size: ${SIZE}KB"
          test "$SIZE" -lt 10240
